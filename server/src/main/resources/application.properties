spring.application.name=tracevault

server.port=8080
server.shutdown=graceful

spring.datasource.url=jdbc:postgresql://localhost:5432/tracevault
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain,text/css,text/javascript,application/javascript

management.endpoints.web.exposure.include=health,info,scalar
management.endpoint.health.probes.enabled=true

spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

springdoc.swagger-ui.path=/docs

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

spring.kafka.consumer.group-id=tracevault-alert-engine
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.audit.tracevault.*
spring.kafka.consumer.properties.spring.json.value.default.type=com.audit.tracevault.infrastructure.adapters.out.kafka.model.AuditLogEvent

spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3

tracevault.kafka.topic.audit-log-created=audit-log-created

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

tracevault.mail.from=no-reply@tracevault.com
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=example@gmail.com
spring.mail.password=password

spring.mail.default-encoding=UTF-8