spring.application.name=tracevault

server.port=8080
server.shutdown=graceful

spring.datasource.url=jdbc:postgresql://postgres:5432/tracevault
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain,text/css,text/javascript,application/javascript

management.endpoints.web.exposure.include=health,info,scalar
management.endpoint.health.probes.enabled=true

spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

springdoc.swagger-ui.path=/docs